<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Academic Portal | Enterprise Edition</title>
    <meta name="description" content="A robust, enterprise-grade academic management platform.">
    <meta name="theme-color" content="#4338ca">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* ================= VARIABLES ================= */
        :root {
            --brand-50: #eff6ff; --brand-100: #dbeafe; --brand-500: #3b82f6;
            --brand-600: #2563eb; --brand-700: #1d4ed8; --brand-900: #1e3a8a;
            --accent-500: #8b5cf6; --accent-600: #7c3aed;
            --success-bg: #d1fae5; --success-text: #065f46;
            --warning-bg: #fef3c7; --warning-text: #92400e;
            --danger-bg: #fee2e2;  --danger-text: #b91c1c;
            --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
            --gray-300: #d1d5db; --gray-400: #9ca3af; --gray-500: #6b7280;
            --gray-600: #4b5563; --gray-700: #374151; --gray-800: #1f2937;
            --gray-900: #111827; --white: #ffffff;
            --sidebar-w: 280px; --header-h: 72px;
            --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        /* ================= RESET & UTILS ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); height: 100vh; overflow: hidden; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; }
        .hidden { display: none !important; }
        .flex { display: flex; } .flex-col { flex-direction: column; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
        .w-full { width: 100%; } .gap-2 { gap: 0.5rem; } .gap-4 { gap: 1rem; }
        .mt-4 { margin-top: 1rem; } .mb-4 { margin-bottom: 1rem; }
        .text-center { text-align: center; } .font-bold { font-weight: 700; }
        .text-sm { font-size: 0.875rem; } .text-muted { color: var(--gray-500); } .text-brand { color: var(--brand-600); }

        /* ================= AUTH LAYOUT ================= */
        #auth-layer { position: fixed; inset: 0; z-index: 9999; background: var(--white); display: flex; }
        .auth-banner { flex: 1; background: linear-gradient(135deg, var(--brand-900), var(--brand-700)); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 40px; position: relative; overflow: hidden; }
        .auth-banner::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .banner-content { position: relative; z-index: 10; text-align: center; }
        .banner-icon { font-size: 4rem; margin-bottom: 20px; color: var(--brand-300); filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); }
        .banner-title { font-family: 'Outfit', sans-serif; font-size: 3rem; font-weight: 800; margin-bottom: 10px; }
        .banner-subtitle { font-size: 1.2rem; opacity: 0.8; max-width: 400px; line-height: 1.5; }
        
        .auth-form-wrapper { flex: 1; max-width: 600px; width: 100%; background: var(--white); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; overflow-y: auto; }
        .auth-card { width: 100%; max-width: 450px; }
        .auth-head { text-align: center; margin-bottom: 30px; }
        .auth-head h2 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 700; color: var(--gray-900); margin-bottom: 5px; }
        .auth-head p { color: var(--gray-500); }

        /* Auth Components */
        .role-tabs { display: flex; background: var(--gray-100); padding: 5px; border-radius: var(--radius-lg); margin-bottom: 25px; }
        .role-btn { flex: 1; padding: 12px; text-align: center; border-radius: var(--radius-md); font-weight: 600; color: var(--gray-500); transition: 0.2s; border: none; background: transparent; }
        .role-btn.active { background: var(--white); color: var(--brand-600); box-shadow: var(--shadow-sm); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--gray-700); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 12px 16px; font-size: 1rem; border: 2px solid var(--gray-200); border-radius: var(--radius-md); transition: 0.2s; background: var(--white); }
        .form-control:focus { border-color: var(--brand-500); box-shadow: 0 0 0 4px var(--brand-100); }
        .btn { width: 100%; padding: 14px; border-radius: var(--radius-md); font-weight: 600; font-size: 1rem; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; border: none; cursor: pointer; position: relative; }
        .btn-primary { background: var(--brand-600); color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { background: var(--brand-700); transform: translateY(-1px); }
        .btn-link { background: transparent; border: none; color: var(--brand-600); margin-top: 20px; width: 100%; cursor: pointer; }
        .btn-link:hover { text-decoration: underline; }
        .upload-zone { background: var(--brand-50); border: 2px dashed var(--brand-300); padding: 20px; border-radius: var(--radius-lg); text-align: center; margin-bottom: 20px; }
        .sync-zone { background: var(--gray-50); border: 1px solid var(--gray-200); padding: 20px; border-radius: var(--radius-lg); margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media(max-width: 900px) { .auth-banner { display: none; } .auth-form-wrapper { max-width: 100%; } }

        /* ================= DASHBOARD LAYOUT ================= */
        #app-shell { display: none; height: 100vh; display: flex; }
        
        /* SIDEBAR - FIXED BOTTOM SECTION */
        .sidebar {
            width: var(--sidebar-w); background: var(--white); border-right: 1px solid var(--gray-200);
            display: flex; flex-direction: column; z-index: 50; flex-shrink: 0;
            transition: margin-left 0.3s ease;
            height: 100vh; /* Ensure full height */
        }
        .sidebar-header { height: var(--header-h); display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--gray-100); gap: 10px; flex-shrink: 0; }
        .logo-text { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 800; color: var(--brand-600); }
        
        /* This class name in CSS must match the element class. In JS Nav.render fills this. */
        .sidebar-nav { 
            flex: 1; /* Pushes footer down */
            overflow-y: auto; 
            padding: 24px 16px; 
        }
        
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--gray-500); font-weight: 500; border-radius: var(--radius-md); margin-bottom: 4px; cursor: pointer; transition: 0.2s; }
        .nav-link:hover { background: var(--gray-50); color: var(--gray-900); }
        .nav-link.active { background: var(--brand-50); color: var(--brand-700); font-weight: 700; }
        .nav-link i { width: 24px; text-align: center; }

        .sidebar-footer { 
            padding: 20px; 
            border-top: 1px solid var(--gray-200); 
            background: var(--gray-50);
            flex-shrink: 0; /* Prevent shrinking */
        }
        .user-card { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-600); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .user-info div:first-child { font-weight: 700; color: var(--gray-900); font-size: 0.9rem; }
        .user-info div:last-child { font-size: 0.75rem; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .btn-logout { width: 100%; padding: 8px; border: 1px solid var(--danger-bg); background: var(--white); color: var(--danger-text); border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-logout:hover { background: var(--danger-bg); }

        /* MAIN CONTENT */
        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--gray-50); position: relative; min-width: 0; }
        .top-bar { height: var(--header-h); background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--gray-200); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; z-index: 40; }
        .page-title { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--gray-900); }
        .ctx-badge { background: var(--brand-50); color: var(--brand-700); padding: 6px 16px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; border: 1px solid var(--brand-100); }
        .content-scroll { flex: 1; overflow-y: auto; padding: 32px; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* ================= COMPONENTS ================= */
        .card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm); padding: 24px; margin-bottom: 24px; }
        .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--gray-100); }
        .card-tit { font-size: 1.1rem; font-weight: 700; color: var(--gray-900); }

        /* Welcome Banner */
        .welcome-card { background: linear-gradient(135deg, var(--brand-700), var(--brand-900)); color: white; padding: 40px; border-radius: var(--radius-lg); margin-bottom: 32px; box-shadow: var(--shadow-lg); border: none; position: relative; overflow: hidden; }
        .welcome-card::after { content:''; position:absolute; top:0; right:0; width:300px; height:100%; background:linear-gradient(to left, rgba(255,255,255,0.1), transparent); pointer-events:none; }
        .welcome-card h2 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
        .welcome-card p { opacity: 0.9; font-size: 1.1rem; font-weight: 500; }

        /* NEW REMINDER DESIGN */
        .rem-card {
            background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-md);
            padding: 20px; margin-bottom: 16px; position: relative; 
            border-left: 4px solid var(--brand-600);
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: var(--shadow-sm); transition: 0.2s;
        }
        .rem-card:hover { transform: translateX(5px); box-shadow: var(--shadow-md); border-color: var(--brand-500); }
        
        .rem-msg { font-size: 1rem; color: var(--gray-800); line-height: 1.5; font-weight: 500; }
        .rem-due-badge { 
            display: inline-block; background: var(--danger-bg); color: var(--danger-text); 
            padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700;
        }

        /* Reminder Footer Styling */
        .rem-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 8px; padding-top: 12px;
            border-top: 1px dashed var(--gray-200);
        }
        .rem-date { font-size: 0.85rem; color: var(--gray-500); display: flex; align-items: center; gap: 6px; }
        
        /* Sender Name in Corner with Color */
        .rem-sender {
            background: var(--brand-50); color: var(--brand-700);
            padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            border: 1px solid var(--brand-100);
        }

        /* DASHBOARD FACTS */
        .fact-list { list-style: none; margin-top: 16px; }
        .fact-list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); font-size: 0.95rem; }
        .fact-list li:last-child { border-bottom: none; }
        .fact-list i { width: 24px; text-align: center; font-size: 1.1rem; }

        /* Subject Framecards */
        .grid-frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .frame-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; cursor: pointer; position: relative; }
        .frame-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--brand-400); }
        .frame-card.mine { border: 2px solid var(--brand-600); }
        .fc-head { padding: 20px; background: linear-gradient(135deg, var(--brand-600), var(--accent-600)); color: white; display: flex; justify-content: space-between; align-items: flex-start; }
        .fc-badge { background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; backdrop-filter: blur(4px); }
        .fc-credit { text-align: right; line-height: 1; font-size: 1.5rem; font-weight: 800; }
        .fc-credit span { display: block; font-size: 0.7rem; font-weight: 600; opacity: 0.9; }
        .fc-body { padding: 24px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .fc-name { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--gray-900); line-height: 1.4; }
        
        /* Standard Lists */
        .list-item { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; position: relative; transition: 0.2s; }
        .list-item:hover { border-color: var(--brand-400); box-shadow: var(--shadow-md); }
        .li-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .li-title { font-weight: 700; color: var(--brand-700); font-size: 1.1rem; }
        .li-sub { font-size: 0.85rem; color: var(--gray-500); }
        .li-body { color: var(--gray-700); font-size: 0.95rem; line-height: 1.6; margin-bottom: 12px; }
        .file-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--gray-100); border: 1px solid var(--gray-200); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; color: var(--gray-700); text-decoration: none; margin-right: 8px; transition: 0.2s; }
        .file-chip:hover { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-700); }
        .btn-del { position: absolute; top: 20px; right: 20px; width: 32px; height: 32px; border-radius: 50%; background: var(--danger-bg); color: var(--danger-text); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-del:hover { transform: scale(1.1); }

        /* Tables */
        .table-wrap { overflow-x: auto; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); background: white; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: var(--gray-50); text-align: left; padding: 16px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--gray-500); border-bottom: 1px solid var(--gray-200); }
        td { padding: 16px; border-bottom: 1px solid var(--gray-200); font-size: 0.95rem; color: var(--gray-800); }
        tr:last-child td { border-bottom: none; }
        .inp-mini { width: 70px; padding: 8px; text-align: center; border: 1px solid var(--gray-300); border-radius: 6px; font-weight: 600; }
        .inp-sm { width: 70px; padding: 6px; text-align: center; border:1px solid var(--gray-300); border-radius:4px; }

        /* UI Overlays */
        #toast-box { position: fixed; bottom: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--gray-900); color: white; padding: 14px 24px; border-radius: 10px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; min-width: 300px; animation: slideIn 0.3s ease; }
        .toast.success { border-left: 4px solid var(--success-text); } .toast.error { border-left: 4px solid var(--danger-text); }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 90%; max-width: 650px; padding: 32px; border-radius: 20px; max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow-xl); }
        .spinner { width: 20px; height: 20px; border: 3px solid #eee; border-top-color: var(--brand-600); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loader { width: 48px; height: 48px; border: 5px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
        .loader.dark { border-color: var(--brand-600); border-bottom-color: transparent; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobile */
        .menu-btn { display: none; font-size: 1.5rem; margin-right: 16px; cursor: pointer; color: var(--gray-600); }
        @media(max-width: 1024px) { .sidebar { position: fixed; left: -100%; height: 100%; box-shadow: var(--shadow-xl); } .sidebar.open { left: 0; } .menu-btn { display: block; } .auth-banner { display: none; } }
    </style>
</head>
<body>

    <div id="toast-box"></div>

    <div id="auth-layer">
        <div class="auth-banner">
            <div class="banner-content">
                <i class="fas fa-graduation-cap banner-icon"></i>
                <h1 class="banner-title">Student Academic Portal</h1>
                <p class="banner-subtitle">Enterprise Management System</p>
            </div>
        </div>
        <div class="auth-form-wrapper">
            <div class="auth-head">
                <h2 style="font-family:var(--font-display); font-weight:800; font-size:2rem; color:var(--gray-900);">Welcome Back</h2>
                <p style="color:var(--gray-500);">Please sign in to your account</p>
            </div>

            <div class="role-tabs">
                <button class="role-btn active" id="tab-student" onclick="Auth.switch('student')">Student</button>
                <button class="role-btn" id="tab-faculty" onclick="Auth.switch('faculty')">Faculty</button>
            </div>
            
            <form id="login-form" class="w-full">
                <div class="form-group"><label class="form-label">User ID</label><input id="l-id" class="form-control" placeholder="Roll No / Email" required></div>
                <div class="form-group"><label class="form-label">Password</label><input type="password" id="l-pass" class="form-control" required></div>
                <button type="submit" class="btn btn-primary">Sign In <div class="spinner hidden" id="l-spin"></div></button>
                <button type="button" class="btn-link" onclick="Auth.toggle()">Create Account</button>
            </form>

            <form id="reg-form" class="hidden w-full">
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">Full Name</label><input id="r-name" class="form-control" required></div>
                    <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="r-phone" class="form-control" required></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label class="form-label">Department</label><select id="r-dept" class="form-control" required><option value="">Select...</option><option value="CSE">CSE</option><option value="ECE">ECE</option><option value="MECH">MECH</option><option value="CIVIL">CIVIL</option><option value="IT">IT</option><option value="AIDS">AI & DS</option></select></div>
                    <div class="form-group"><label class="form-label">Batch</label><input id="r-batch" class="form-control" placeholder="e.g. 2023-2027" required></div>
                </div>
                
                <div id="sec-student">
                    <div class="grid-2">
                        <div class="form-group"><label class="form-label">Roll No</label><input id="r-roll" class="form-control"></div>
                        <div class="form-group"><label class="form-label">Semester</label><select id="r-sem" class="form-control"><option value="1">Sem 1</option><option value="2">Sem 2</option><option value="3">Sem 3</option><option value="4">Sem 4</option><option value="5">Sem 5</option><option value="6">Sem 6</option><option value="7">Sem 7</option><option value="8">Sem 8</option></select></div>
                    </div>
                </div>

                <div id="sec-faculty" class="hidden">
                    <div class="form-group"><label class="form-label">Email</label><input type="email" id="r-email" class="form-control"></div>
                    <div class="form-group"><label class="form-label">Role</label><select id="r-role" class="form-control" onchange="Auth.handleFac()"><option value="teaching">Teaching Faculty</option><option value="advisor">Advisor</option></select></div>
                    
                    <div id="zone-advisor" class="upload-zone hidden">
                        <strong class="text-brand"><i class="fas fa-cloud-upload-alt"></i> Upload Master List</strong>
                        <p class="text-sm text-muted mb-3">Excel (.xlsx): Subject Name, Code, Credit, Faculty Name</p>
                        <input type="file" id="r-excel" class="form-control" accept=".xlsx,.xls">
                        <p class="text-xs text-danger font-bold mt-2">* Warning: Resets Batch Data</p>
                    </div>

                    <div id="zone-teaching" class="sync-zone hidden">
                        <label class="form-label">Select Subject</label>
                        <div class="flex gap-2"><select id="r-subject" class="form-control"><option value="">Sync Required...</option></select><button type="button" class="btn btn-primary" style="width:auto;" onclick="Auth.syncSubs()">Sync</button></div>
                    </div>
                </div>

                <div class="form-group"><label class="form-label">Password</label><input type="password" id="r-pass" class="form-control" required></div>
                <button type="submit" class="btn btn-primary">Register <div class="spinner hidden" id="r-spin"></div></button>
                <button type="button" class="btn-link" onclick="Auth.toggle()">Back to Login</button>
            </form>
        </div>
    </div>

    <div id="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><i class="fas fa-graduation-cap text-brand"></i> <span class="logo-text">Portal</span></div>
            <nav class="sidebar-nav" id="nav-mount"></nav>
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="avatar" id="u-av">U</div>
                    <div class="user-info"><div id="u-name">Name</div><div id="u-role">Role</div></div>
                </div>
                <button class="btn-logout" onclick="App.logout()">Sign Out</button>
            </div>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <div class="flex items-center"><i class="fas fa-bars menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')"></i><h2 class="page-title" id="pg-title">Dashboard</h2></div>
                <div class="batch-pill" id="header-ctx">Info</div>
            </header>
            <div class="content-scroll"><div class="container" id="main-view"></div></div>
        </main>
    </div>

    <div class="modal-bg" id="modal">
        <div class="modal-box">
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg text-brand" id="m-tit">Title</h3><button onclick="UI.modal(false)" style="font-size:1.5rem;color:#999;">&times;</button></div>
            <div id="m-body"></div>
        </div>
    </div>

    <script>
        // 1. CONFIG
        const cfg = { apiKey: "AIzaSyDhZwEZaYnvNUqHjfFeBHlH3QlT-lGJ1Os", authDomain: "collegeportal-0.firebaseapp.com", projectId: "collegeportal-0", storageBucket: "collegeportal-0.firebasestorage.app", messagingSenderId: "612988551318", appId: "1:612988551318:web:e2081b9c9974d2e37a42b7" };
        try { firebase.initializeApp(cfg); var db = firebase.firestore(); var auth = firebase.auth(); db.enablePersistence().catch(()=>{}); } catch(e){console.error(e);}
        const App = { user: null };

        // 2. UTILS
        const UI = {
            toast: (m, t='info') => {
                const b = document.getElementById('toast-box'); if(!b) { const d=document.createElement('div'); d.id='toast-box'; document.body.appendChild(d); }
                const e = document.createElement('div'); e.className = `toast ${t}`; e.innerHTML = `<span>${m}</span>`;
                document.getElementById('toast-box').appendChild(e); setTimeout(()=>e.remove(), 3000);
            },
            modal: (s, t, h) => {
                const m = document.getElementById('modal'); m.style.display = s ? 'flex' : 'none';
                if(s) { document.getElementById('m-tit').innerText = t; document.getElementById('m-body').innerHTML = h; }
            }
        };

        // 3. AUTH LOGIC
        const Auth = {
            toggle: () => { document.getElementById('login-form').classList.toggle('hidden'); document.getElementById('reg-form').classList.toggle('hidden'); },
            switch: (r) => {
                document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active')); document.getElementById(`tab-${r}`).classList.add('active');
                document.getElementById('sec-student').classList.toggle('hidden', r!=='student'); document.getElementById('sec-faculty').classList.toggle('hidden', r!=='faculty');
                if(r==='faculty') Auth.handleFac();
            },
            handleFac: () => { const r = document.getElementById('r-role').value; document.getElementById('zone-advisor').classList.toggle('hidden', r!=='advisor'); document.getElementById('zone-teaching').classList.toggle('hidden', r!=='teaching'); },
            syncSubs: async () => {
                const d=document.getElementById('r-dept').value; const b=document.getElementById('r-batch').value;
                if(!d||!b) return UI.toast("Dept & Batch required", "error");
                const btn = document.querySelector('#zone-teaching button'); btn.innerHTML = '<div class="spinner"></div>';
                try {
                    const s = await db.collection('subjects').where('dept','==',d).where('batch','==',b).get();
                    const sel = document.getElementById('r-subject'); sel.innerHTML = "<option value=''>Select...</option>";
                    if(s.empty) UI.toast("No subjects found", "error");
                    else { s.forEach(doc=>{ const da=doc.data(); sel.innerHTML+=`<option value="${da.name}">${da.name} (${da.code})</option>`; }); UI.toast("Synced!", "success"); }
                } catch(e) { UI.toast("Sync failed", "error"); }
                btn.innerHTML = 'Sync';
            },
            parse: (file) => { return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>{ try{ const wb=XLSX.read(e.target.result,{type:'array'}); const j=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]); const d=j.map(row=>{ let n,c,cr,f; Object.keys(row).forEach(k=>{ const key=k.toLowerCase(); if(key.includes('subject')&&key.includes('name'))n=row[k]; else if((key==='name'||key==='subject')&&!n)n=row[k]; else if(key.includes('code'))c=row[k]; else if(key.includes('credit'))cr=row[k]; else if(key.includes('faculty'))f=row[k]; }); if(n) return {name:n, code:c||'N/A', credit:cr||'3', faculty:f||'TBA'}; }).filter(x=>x); res(d); }catch(er){rej(er);} }; r.readAsArrayBuffer(file); }); },
            reg: async (e) => {
                e.preventDefault(); document.getElementById('r-spin').classList.remove('hidden');
                if(!auth.currentUser) await auth.signInAnonymously();
                const role = document.querySelector('.role-btn.active').innerText.toLowerCase().includes('student')?'student':'faculty';
                const base = { name:document.getElementById('r-name').value, phone:document.getElementById('r-phone').value, dept:document.getElementById('r-dept').value, batch:document.getElementById('r-batch').value.trim(), role, createdAt:new Date().toISOString() };
                try {
                    if(role==='student') {
                        const roll = document.getElementById('r-roll').value;
                        await db.collection('users').doc(roll).set({ ...base, roll, sem:document.getElementById('r-sem').value, uid:roll, pass:document.getElementById('r-pass').value });
                    } else {
                        const fr = document.getElementById('r-role').value; const em = document.getElementById('r-email').value;
                        if(fr==='advisor') {
                            const f = document.getElementById('r-excel').files[0]; if(!f) throw new Error("Excel needed");
                            const subs = await Auth.parse(f);
                            const old = await db.collection('subjects').where('dept','==',base.dept).where('batch','==',base.batch).get();
                            const b = db.batch(); old.forEach(d=>b.delete(d.ref)); await b.commit();
                            const wb = db.batch(); subs.forEach(s=>{ wb.set(db.collection('subjects').doc(), { ...s, dept:base.dept, batch:base.batch }); });
                            await wb.commit();
                        } else { base.subject = document.getElementById('r-subject').value; if(!base.subject) throw new Error("Sync First"); }
                        await db.collection('users').doc(em).set({ ...base, email:em, facRole:fr, uid:em, pass:document.getElementById('r-pass').value });
                    }
                    UI.toast("Registered!", "success"); Auth.toggle();
                } catch(er){ UI.toast(er.message, "error"); }
                document.getElementById('r-spin').classList.add('hidden');
            },
            login: async (e) => {
                e.preventDefault(); document.getElementById('l-spin').classList.remove('hidden');
                if(!auth.currentUser) await auth.signInAnonymously();
                const u=document.getElementById('l-id').value; const p=document.getElementById('l-pass').value;
                try {
                    const d = await db.collection('users').doc(u).get();
                    if(d.exists && d.data().pass===p) { App.user=d.data(); localStorage.setItem('sap_eng_user', JSON.stringify(App.user)); App.init(); }
                    else UI.toast("Invalid Credentials", "error");
                } catch(er) { UI.toast("Login Error", "error"); }
                document.getElementById('l-spin').classList.add('hidden');
            }
        };
        document.getElementById('login-form').addEventListener('submit', Auth.login);
        document.getElementById('reg-form').addEventListener('submit', Auth.reg);

        // 4. APP INIT
        auth.onAuthStateChanged(u => {
            if(u) {
                const c = localStorage.getItem('sap_eng_user');
                if(c) { App.user = JSON.parse(c); App.init(); }
                else db.collection('users').doc(u.uid).get().then(d=>{ if(d.exists){ App.user=d.data(); localStorage.setItem('sap_eng_user', JSON.stringify(App.user)); App.init(); }});
            } else { document.getElementById('auth-layer').style.display='flex'; }
        });
        App.init = () => {
            document.getElementById('auth-layer').style.display='none'; document.getElementById('app-shell').style.display='flex';
            document.getElementById('u-name').innerText = App.user.name; document.getElementById('u-role').innerText = App.user.role==='student'?'Student':App.user.facRole;
            document.getElementById('u-av').innerText = App.user.name[0]; document.getElementById('header-ctx').innerText = `${App.user.dept} • ${App.user.batch}`;
            Nav.render(); Router.go('home');
        };
        App.logout = () => { localStorage.removeItem('sap_eng_user'); auth.signOut(); location.reload(); };

        // 5. NAVIGATION
        const Nav = {
            render: () => {
                const n = document.getElementById('nav-mount'); n.innerHTML = '';
                const mk = (id,i,l) => n.innerHTML += `<div class="nav-link" id="nav-${id}" onclick="Router.go('${id}')"><i class="fas fa-${i}"></i> ${l}</div>`;
                mk('home','home','Dashboard');
                if(App.user.role==='student') {
                    mk('subjects','book-open','Subjects'); mk('reminders','bell','Reminders'); mk('projects','laptop-code','Projects');
                    mk('cocurricular','trophy','Co-Curricular'); mk('sports','running','Sports'); mk('assignments','clipboard-list','Assignments'); mk('marklist','chart-bar','Results');
                } else if(App.user.role==='faculty') {
                    if(App.user.facRole==='teaching') { mk('subjects','book','My Subject'); mk('assignments','pen-to-square','Assignments'); mk('reminders','bullhorn','Reminders'); mk('marklist','marker','Marks'); }
                    else { 
                        mk('subjects','list','Master List'); mk('reminders','bell','Reminders');
                        // ADVISOR SUPER POWERS
                        mk('projects','laptop-code','Student Projects'); mk('cocurricular','trophy','Student Co-Curr'); mk('sports','running','Student Sports');
                    }
                }
            }
        };

        const Router = {
            go: async (p) => {
                document.querySelectorAll('.nav-link').forEach(e=>e.classList.remove('active'));
                document.getElementById(`nav-${p}`).classList.add('active');
                document.getElementById('pg-title').innerText = p.charAt(0).toUpperCase() + p.slice(1);
                const v = document.getElementById('main-view');
                v.innerHTML = '<div class="flex justify-center p-6"><div class="loader dark"></div></div>';

                if(p==='home') {
                    // REFACTORED DASHBOARD LAYOUT
                    v.innerHTML = `
                        <div class="welcome-card"><h2>Welcome, ${App.user.name}!</h2><p>Logged in as ${App.user.role}</p></div>
                        <div class="grid-2">
                            <div class="card">
                                <h3><i class="fas fa-info-circle text-brand"></i> System Highlights</h3>
                                <ul class="fact-list">
                                    <li><i class="fas fa-shield-alt text-success"></i> Enterprise Grade Security Enabled</li>
                                    <li><i class="fas fa-bolt text-warning"></i> Real-time Firebase Sync Active</li>
                                    <li><i class="fas fa-cloud-download-alt text-brand"></i> Fast File Retrieval System</li>
                                    <li><i class="fas fa-users text-accent"></i> Role-based Access Control</li>
                                </ul>
                            </div>
                            <div class="card">
                                <h3><i class="fas fa-bell text-danger"></i> Latest Alerts</h3>
                                <div id="dash-rem"></div>
                            </div>
                        </div>
                    `;
                    API.loadDashRem(); if(App.user.role==='student') API.checkPopup();
                }
                else if(p==='subjects') {
                    const s=await db.collection('subjects').where('dept','==',App.user.dept).where('batch','==',App.user.batch).get();
                    if(s.empty) { v.innerHTML='<div class="card text-center p-6"><h3>No Subjects</h3></div>'; return; }
                    let h='<div class="grid-frames">';
                    s.forEach(doc=>{ const d=doc.data(); const mine=App.user.facRole==='teaching'&&App.user.subject===d.name;
                        h+=`<div class="frame-card ${mine?'mine':''}" onclick="API.openSub('${d.name}')"><div class="fc-head"><span class="fc-badge">${d.code}</span><div class="fc-credit">${d.credit}<span>CREDIT</span></div></div><div class="fc-body"><div class="fc-name">${d.name}</div><div class="fc-meta"><div class="fc-icon"><i class="fas fa-user"></i></div><div><small style="display:block;font-weight:700;color:#94a3b8;font-size:0.7rem;">FACULTY</small><b>${d.faculty}</b></div></div>${mine?'<div class="text-right text-xs text-primary font-bold mt-2">YOUR SUBJECT</div>':''}</div></div>`;
                    });
                    v.innerHTML = h+'</div>';
                }
                else if(['projects','sports','cocurricular'].includes(p)) {
                    let h=''; if(App.user.role==='student') h+=`<div class="card"><h3>Upload</h3><div class="grid-2"><div class="form-group"><label class="form-label">Title</label><input id="gn-t" class="form-control"></div><div class="form-group"><label class="form-label">Files</label><input type="file" id="gn-f" class="form-control" multiple></div></div><div class="form-group"><label class="form-label">Description</label><textarea id="gn-d" class="form-control" rows="3"></textarea></div><button class="btn btn-primary" style="width:auto" onclick="API.upGen('${p}')">Submit</button></div>`;
                    h+=`<div class="card"><h3>${App.user.facRole==='advisor'?'All Submissions (Advisor View)':'My Submissions'}</h3><div id="gn-list"></div></div>`;
                    v.innerHTML=h; API.fetchGen(p);
                }
                else if(p==='reminders') {
                    let h=''; if(App.user.role==='faculty') h+=`<div class="card"><h3>Send</h3><div class="flex gap-2 mt-3"><input id="rm-msg" class="form-control" placeholder="Msg"><input type="date" id="rm-date" class="form-control" style="width:auto"><button class="btn btn-primary" style="width:auto" onclick="API.sendRem()">Send</button></div></div>`;
                    h+=`<div class="card"><h3>Timeline</h3><div id="rem-list" class="reminder-feed"></div></div>`; v.innerHTML=h; API.fetchRem();
                }
                else if(p==='assignments') {
                    if(App.user.facRole==='teaching') v.innerHTML=`<div class="card"><h3>Post</h3><div class="form-group"><label class="form-label">Desc</label><textarea id="as-desc" class="form-control" rows="2"></textarea></div><div class="grid-2"><div class="form-group"><label class="form-label">Ref File</label><input type="file" id="as-f" class="form-control"></div><div class="form-group"><label class="form-label">Due</label><input type="date" id="as-date" class="form-control"></div></div><button class="btn btn-primary mt-3" style="width:auto" onclick="API.postAsn()">Post</button></div><div class="card"><h3>History</h3><div id="as-list"></div></div>`;
                    else v.innerHTML=`<div class="card"><h3>Assignments</h3><div id="as-list"></div></div>`;
                    API.loadAsn();
                }
                else if(p==='marklist') API.renderMarks(v);
            }
        };

        // 6. API
        const API = {
            openSub: async (n) => {
                UI.modal(true, n, '<div class="text-center"><div class="loader dark"></div></div>');
                const s = await db.collection('materials').where('subject','==',n).where('batch','==',App.user.batch).get();
                let h = '';
                if(App.user.facRole==='teaching' && App.user.subject===n) {
                    h+=`<div class="upload-zone"><strong class="text-primary block mb-2">Add Material</strong><input id="mat-desc" class="form-control mb-3" placeholder="Description"><input type="file" id="mat-f" class="form-control"><button class="btn btn-primary mt-3" style="width:auto" onclick="API.upMat('${n}')">Upload</button></div>`;
                }
                h+='<h4 class="font-bold mb-3 text-muted">Files</h4>'; if(s.empty) h+='<p class="text-muted text-sm">No files.</p>';
                s.forEach(d=>{ const f=d.data(); h+=`<div class="list-item flex justify-between items-center"><div><span class="font-bold text-primary block mb-1">${f.fileName}</span><small class="text-muted">${f.desc||''}</small></div><a href="${f.data}" download="${f.fileName}" class="btn btn-primary" style="width:auto; padding:8px 16px; font-size:0.8rem;">Download</a></div>`; });
                document.getElementById('m-body').innerHTML = h;
            },
            upMat: (n) => {
                const f=document.getElementById('mat-f').files[0]; const d=document.getElementById('mat-desc').value; if(!f) return;
                const r=new FileReader(); r.onload=async e=>{ await db.collection('materials').add({ subject:n, desc:d, batch:App.user.batch, dept:App.user.dept, fileName:f.name, data:e.target.result }); UI.toast("Uploaded","success"); API.openSub(n); }; r.readAsDataURL(f);
            },
            sendRem: async () => {
                const m=document.getElementById('rm-msg').value; const d=document.getElementById('rm-date').value; if(!m) return;
                await db.collection('reminders').add({ msg:m, deadline:d, batch:App.user.batch, dept:App.user.dept, sender:App.user.name, ts:Date.now() });
                UI.toast("Sent","success"); API.fetchRem();
            },
            fetchRem: async () => {
                const s = await db.collection('reminders').where('batch','==',App.user.batch).where('dept','==',App.user.dept).get();
                let a=[]; s.forEach(d=>a.push(d.data())); a.sort((x,y)=>y.ts-x.ts);
                let h=''; 
                a.forEach(r=>{ 
                    // FIX FOR INVALID DATE AND DESIGN
                    let dateStr = 'Just now';
                    if(r.ts) {
                        try { dateStr = new Date(r.ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: 'numeric' }); } 
                        catch(e) { dateStr = 'Date Error'; }
                    }

                    h += `
                    <div class="rem-card">
                        <div class="rem-msg">${r.msg}</div>
                        ${r.deadline ? `<div class="mt-2"><span class="rem-due-badge"><i class="fas fa-exclamation-circle"></i> Due: ${r.deadline}</span></div>` : ''}
                        <div class="rem-footer">
                            <span class="rem-date"><i class="far fa-clock"></i> ${dateStr}</span>
                            <span class="rem-sender"><i class="fas fa-user-circle"></i> ${r.sender}</span>
                        </div>
                    </div>`;
                });
                document.getElementById('rem-list').innerHTML = h||'<p class="text-muted">No announcements yet.</p>';
            },
            loadDashRem: async () => {
                const s = await db.collection('reminders').where('batch','==',App.user.batch).where('dept','==',App.user.dept).get();
                let a=[]; s.forEach(d=>a.push(d.data())); a.sort((x,y)=>y.ts-x.ts);
                const d=document.getElementById('dash-rem'); if(a.length===0) { d.innerHTML='<small class="text-muted">No new alerts.</small>'; return; }
                let h=''; a.slice(0,2).forEach(r=>h+=`<div class="list-item" style="padding:12px;"><div class="font-bold text-sm mb-1" style="color:var(--brand-700);">${r.sender}</div><div class="text-sm">${r.msg}</div></div>`);
                d.innerHTML=h;
            },
            checkPopup: async () => {
                const s = await db.collection('reminders').where('batch','==',App.user.batch).where('dept','==',App.user.dept).get();
                if(!s.empty) {
                    let a=[]; s.forEach(d=>a.push(d.data())); a.sort((x,y)=>y.ts-x.ts); const l=a[0];
                    const ls=sessionStorage.getItem('last_pop');
                    if(ls!==l.ts.toString()) { UI.modal(true, "Notice", `<div class="text-center p-4"><h3 class="text-primary font-bold mb-2">${l.sender}</h3><p class="text-lg mb-4">${l.msg}</p><button class="btn btn-primary" onclick="sessionStorage.setItem('last_pop','${l.ts}'); UI.modal(false)">OK</button></div>`); }
                }
            },
            upGen: async (t) => {
                const title=document.getElementById('gn-t').value; const desc=document.getElementById('gn-d').value; const inp=document.getElementById('gn-f');
                if(!title || inp.files.length===0) return UI.toast("Info missing", "error");
                const files = await Promise.all(Array.from(inp.files).map(f=>new Promise((res)=>{ const r=new FileReader(); r.onload=e=>res({name:f.name, data:e.target.result}); r.readAsDataURL(f); })));
                await db.collection(t).add({ title, desc, files, uid:App.user.uid, name:App.user.name, roll:App.user.roll, batch:App.user.batch, dept:App.user.dept, date:new Date().toLocaleDateString() });
                UI.toast("Uploaded","success"); API.fetchGen(t);
            },
            fetchGen: async (t) => {
                let s; 
                if(App.user.role==='faculty') s=await db.collection(t).where('batch','==',App.user.batch).where('dept','==',App.user.dept).get();
                else s=await db.collection(t).where('uid','==',App.user.uid).get();
                let h=''; 
                s.forEach(doc=>{ 
                    const d=doc.data(); 
                    const fs=d.files.map(f=>`<a href="${f.data}" download="${f.name}" class="file-chip"><i class="fas fa-paperclip"></i> ${f.name}</a>`).join('');
                    const del = App.user.facRole==='advisor' ? `<button onclick="API.delGen('${t}','${doc.id}')" class="btn-del"><i class="fas fa-trash"></i></button>` : '';
                    h+=`<div class="list-item"><div class="li-head"><span class="li-title">${d.title}</span><small>${d.date}</small></div><div class="li-sub">${d.name} (${d.roll})</div><p class="li-body">${d.desc}</p><div>${fs}</div>${del}</div>`; 
                });
                document.getElementById('gn-list').innerHTML = h||'<p class="text-muted">Empty.</p>';
            },
            delGen: async (col, id) => { if(confirm("Delete?")) { await db.collection(col).doc(id).delete(); UI.toast("Deleted", "success"); API.fetchGen(col); } },
            postAsn: async () => {
                const d=document.getElementById('as-desc').value; const dt=document.getElementById('as-date').value; const f=document.getElementById('as-file').files[0];
                if(!d) return; let fd=null; if(f) fd = await new Promise((res)=>{ const r=new FileReader(); r.onload=e=>res({name:f.name, data:e.target.result}); r.readAsDataURL(f); });
                await db.collection('assignments').add({ desc:d, date:dt, file:fd, subject:App.user.subject, batch:App.user.batch, dept:App.user.dept, posted:new Date().toLocaleDateString() });
                UI.toast("Posted","success"); API.loadAsn();
            },
            loadAsn: async () => {
                const s=await db.collection('assignments').where('batch','==',App.user.batch).where('dept','==',App.user.dept).get();
                let h=''; s.forEach(doc=>{ const d=doc.data(); h+=`<div class="list-item"><div class="li-head"><span class="li-title">${d.subject}</span><small>${d.posted}</small></div><p class="li-body">${d.desc}</p>${d.file?`<a href="${d.file.data}" download="${d.file.name}" class="file-chip mb-3"><i class="fas fa-download"></i> ${d.file.name}</a><br>`:''}${d.date?`<span class="rem-due">Due: ${d.date}</span>`:''}</div>`; });
                document.getElementById('as-list').innerHTML=h||'<p class="text-muted">No assignments.</p>';
            },
            renderMarks: async (c) => {
                if(App.user.role==='faculty') {
                    const u=await db.collection('users').where('role','==','student').where('batch','==',App.user.batch).where('dept','==',App.user.dept).get();
                    if(u.empty) { c.innerHTML='<div class="card">No students.</div>'; return; }
                    let h=`<div class="card"><div class="card-head"><h3 class="card-tit">Marks: ${App.user.subject}</h3><button class="btn btn-primary" style="width:auto; padding:8px 16px; font-size:0.9rem;" onclick="API.saveMarks()">Save All</button></div><div class="table-wrap"><table><thead><tr><th>Roll</th><th>Name</th><th>CIA1</th><th>CIA2</th><th>Model</th></tr></thead><tbody>`;
                    const ms=await db.collection('marks').where('subject','==',App.user.subject).where('batch','==',App.user.batch).get();
                    const m={}; ms.forEach(d=>m[d.data().uid]=d.data());
                    u.forEach(d=>{ const s=d.data(); const x=m[s.uid]||{}; h+=`<tr><td>${s.roll}</td><td>${s.name}</td><td><input class="inp-sm" id="c1-${s.uid}" value="${x.c1||''}"></td><td><input class="inp-sm" id="c2-${s.uid}" value="${x.c2||''}"></td><td><input class="inp-sm" id="mod-${s.uid}" value="${x.mod||''}"></td></tr>`; });
                    c.innerHTML=h+'</tbody></table></div></div>';
                } else {
                    const s=await db.collection('marks').where('uid','==',App.user.uid).get();
                    let h=`<div class="card"><h3>Results</h3><div class="table-wrap"><table><thead><tr><th>Subject</th><th>CIA1</th><th>CIA2</th><th>Model</th></tr></thead><tbody>`;
                    s.forEach(d=>{ const m=d.data(); h+=`<tr><td>${m.subject}</td><td>${m.c1}</td><td>${m.c2}</td><td>${m.mod}</td></tr>`; });
                    c.innerHTML=h+'</tbody></table></div></div>';
                }
            },
            saveMarks: async () => {
                const b=db.batch(); document.querySelectorAll('.inp-sm').forEach(i=>{
                    const [t,u]=i.id.split('-'); const r=db.collection('marks').doc(`${App.user.batch}_${App.user.subject}_${u}`.replace(/\s/g,''));
                    b.set(r, {[t]:i.value, uid:u, subject:App.user.subject, batch:App.user.batch, dept:App.user.dept}, {merge:true});
                });
                await b.commit(); UI.toast("Saved","success");
            }
        };
    </script>
</body>
</html>
